name: android_release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android-arm:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-22.04
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          key: gradle-cache-${{ hashFiles('starboard/android/apk/**/*gradle*') }}
          path: |
            /root/.gradle/caches
            /root/.gradle/wrapper
      - name: Set up Cloud SDK
        uses: isarkis/setup-gcloud@40dce7857b354839efac498d3632050f568090b6

      - name: Set Android env vars
        run: |
          export ANDROID_HOME="$GITHUB_WORKSPACE/Android"
          mkdir -p "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          # FIX Ở ĐÂY: Cho cả ANDROID_SDK_ROOT trỏ cùng vào thư mục Android luôn
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          PROJECT_NAME=$(gcloud config get-value project)

      - name: Install GN
        run: |
          wget https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest -O gn.zip
          unzip gn.zip -d gn_bin
          sudo mv gn_bin/gn /usr/local/bin/gn
          sudo chmod +x /usr/local/bin/gn

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH" >> $GITHUB_ENV

      # ĐƯA STEP CÀI ĐẶT DEPENDENCIES LÊN TRƯỚC STEP GN
      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -qqy --no-install-recommends \
            bison clang libasound2-dev libgles2-mesa-dev libglib2.0-dev \
            libxcomposite-dev libxi-dev libxrender-dev nasm ninja-build \
            python3-venv python-is-python3 ccache gcc-multilib \
            g++-multilib libc6-dev-i386 protobuf-compiler
          ccache --max-size=20G
          bash ./starboard/tools/download_clang.sh
          bash ./starboard/android/shared/download_sdk.sh

      # THÊM STEP NÀY ĐỂ FIX LỖI THIẾU FILE LASTCHANGE.GNI
      - name: Generate lastchange.gni
        run: |
          mkdir -p build/util
          echo 'lastchange = "unknown"' > build/util/lastchange.gni
          echo 'lastchange_year = "2024"' >> build/util/lastchange.gni
          # Nếu repo của bác có sẵn tool generate, bác có thể thử bỏ comment dòng dưới:
          # python3 build/util/lastchange.py -o build/util/LASTCHANGE --version-macro-header build/util/lastchange.gni || true

      # STEP GN BÂY GIỜ ĐÃ CÓ ĐỦ CLANG, SDK VÀ LASTCHANGE.GNI
      - name: GN
        run: |
          gn gen out/android-arm_gold --args='target_platform="android-arm" target_os="android" target_cpu="arm" build_type="gold" sb_api_version=15'

      - name: Generate temporary signing key
        run: |
          keytool -genkeypair -v \
            -keystore $HOME/.android/debug.keystore \
            -alias allowedonly \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "123456" \
            -keypass "123456" \
            -dname "CN=Temp, OU=Temp, O=Temp, L=Temp, S=Temp, C=US"

      - name: Build Cobalt
        run: |
          # 1. CẤP QUYỀN THỰC THI CHO GRADLEW (SỬA LỖI PERMISSION DENIED)
          chmod +x starboard/android/apk/gradlew
          NINJA_STATUS="[%e sec | %f/%t %u remaining | %c/sec | j%r] "
          echo "--- BƯỚC ĐỆM 1: Ép sinh các file Perfetto Protobuf trước ---"
          # Thử ép build trực tiếp target sinh file pbzero của Perfetto (nếu tồn tại)
          ninja -C out/android-arm_gold third_party/perfetto/protos/perfetto/trace:zero || true
          # Thử ép build đích danh cái file đang bị thiếu
          ninja -C out/android-arm_gold gen/third_party/perfetto/protos/perfetto/trace/trace_packet.pbzero.h || true
          echo "--- BƯỚC ĐỆM 2: Dùng cờ -k 0 để build ráng ---"
          # Lệnh này CÓ THỂ LỖI, nhưng kệ nó. Cờ '-k 0' ép Ninja bỏ qua lỗi và chạy 
          # TOÀN BỘ các script sinh file tự động (protoc) trên toàn dự án.
          ninja -C out/android-arm_gold cobalt -k 0 || true
          echo "--- BƯỚC CHÍNH: Build lại Cobalt ---"
          # Lúc này, mọi file .h và .pbzero.h đều đã được sinh ra và nằm sẵn trên ổ cứng. 
          # Trình biên dịch C++ sẽ chạy mượt mà qua đoạn này!
          ninja -C out/android-arm_gold cobalt
          echo "--- BƯỚC CUỐI: Đóng gói ---"
          ninja -C out/android-arm_gold cobalt_install

      - name: Upload APK to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: out/android-arm_gold/cobalt.apk
          asset_name: cobalt-android-arm.apk
          tag: ${{ github.ref_name }}
          overwrite: true
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TizenTube-Built
          path: |
            out/android-arm_gold/cobalt.apk
          if-no-files-found: error